<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centering a Div</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        div{
            width: 300px;
            height: 200px;
            background-color: lightblue;
            text-align: center;
        }
    </style>

</head>
<body>
    <div>
        <p>This div is centered both horizontally and vertically.</p>
    </div>
</body>
</html>
